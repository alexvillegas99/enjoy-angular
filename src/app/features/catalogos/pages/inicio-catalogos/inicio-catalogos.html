<section class="page animate-in">

  <!-- HEADER -->
  <div class="page-header">
    <div class="icon-badge icon-badge-primary">
      <lucide-icon name="database" style="width:22px; height:22px;"></lucide-icon>
    </div>
    <div class="page-header-title">
      <h1 class="page-title">Catálogos del sistema</h1>
      <p class="subtle">
        Gestiona los catálogos base. Estos valores se reflejan en toda la plataforma.
      </p>
    </div>
  </div>

  <!-- GRID DE TARJETAS -->
  <div
    class="grid gap-4"
    style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));"
  >
    @for (item of catalogos; track item.route) {
      <a
        [routerLink]="item.route"
        class="card no-underline"
        style="padding:20px; display:flex; flex-direction:column; gap:14px; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;"
        onmouseover="this.style.transform='translateY(-2px)'; this.style.borderColor='rgba(255,159,28,0.4)'; this.style.boxShadow='0 10px 28px rgba(0,0,0,0.35)'"
        onmouseout="this.style.transform='translateY(0)'; this.style.borderColor='var(--stroke)'; this.style.boxShadow='none'"
      >
        <div style="display:flex; align-items:flex-start; gap:14px;">
          <div
            style="width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;"
            [style.background]="item.iconBg"
            [style.color]="item.iconColor"
          >
            <lucide-icon
              [name]="item.icono"
              style="width:22px; height:22px;"
            ></lucide-icon>
          </div>
          <div style="flex:1; min-width:0;">
            <h2 class="section-title" style="font-size:15.5px; margin:0;">
              {{ item.titulo }}
            </h2>
            <p class="subtle" style="font-size:12.5px; margin-top:4px; line-height:1.5;">
              {{ item.descripcion }}
            </p>
          </div>
        </div>

        <div
          style="display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid var(--stroke); margin-top:auto;"
        >
          <span style="font-size:10.5px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.4px; font-weight:600;">
            Configuración
          </span>
          <span
            style="display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--orange);"
          >
            Administrar
            <lucide-icon name="arrow-right" style="width:14px; height:14px;"></lucide-icon>
          </span>
        </div>
      </a>
    }
  </div>
</section>
