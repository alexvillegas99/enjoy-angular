<div class="flex flex-wrap gap-2">
  @for (c of ciudades; track c._id) {
    <button
      type="button"
      class="chip"
      [class.is-active]="isSelected(c._id)"
      (click)="toggle(c._id)"
    >
      {{ c.nombre }}
    </button>
  } @empty {
    <p class="subtle text-sm py-2">No hay ciudades disponibles.</p>
  }
</div>
