<div class="space-y-4">
  <!-- Buscador + seleccionada -->
  <div class="flex items-center gap-3">
    <div class="search-field flex-1">
      <span class="search-field-icon">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
        </svg>
      </span>
      <input
        type="text"
        [(ngModel)]="query"
        placeholder="Buscar provincia…"
        class="input"
      />
    </div>
    @if (seleccionada) {
      <span class="badge badge-accent whitespace-nowrap">{{ seleccionada.nombre }}</span>
    }
  </div>

  <!-- Lista de provincias (single-select) -->
  <div class="flex flex-wrap gap-2 max-h-56 overflow-y-auto pr-1">
    @for (p of filtradas; track p._id) {
      <button
        type="button"
        class="chip"
        [class.is-active]="p._id === value"
        (click)="seleccionar(p._id)"
      >
        {{ p.nombre }}
      </button>
    }
  </div>
</div>
