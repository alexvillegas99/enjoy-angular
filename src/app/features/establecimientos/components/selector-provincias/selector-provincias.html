<div class="space-y-3">
  <!-- Buscador + seleccionada -->
  <div class="flex items-center gap-2">
    <div class="relative flex-1">
      <input
        type="text"
        [(ngModel)]="query"
        placeholder="Buscar provincia…"
        class="w-full border border-gray-200 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary"
      />
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-body" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
      </svg>
    </div>
    @if (seleccionada) {
      <span class="text-xs text-text-body whitespace-nowrap">{{ seleccionada.nombre }}</span>
    }
  </div>

  <!-- Lista de provincias (single-select) -->
  <div class="flex flex-wrap gap-2 max-h-56 overflow-y-auto pr-1">
    @for (p of filtradas; track p._id) {
      <button
        type="button"
        class="px-4 py-1.5 rounded-full text-xs font-medium border transition"
        [class.bg-primary]="p._id === value"
        [class.text-white]="p._id === value"
        [class.border-primary]="p._id === value"
        (click)="seleccionar(p._id)"
      >
        {{ p.nombre }}
      </button>
    }
  </div>
</div>
