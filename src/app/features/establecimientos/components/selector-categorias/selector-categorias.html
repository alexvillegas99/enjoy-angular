<div class="space-y-4">
  <!-- Buscador + contador -->
  <div class="flex items-center gap-3">
    <div class="relative flex-1">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-faint" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        [(ngModel)]="query"
        placeholder="Buscar categoría…"
        class="input pl-10"
      />
    </div>
    <span class="badge badge-muted whitespace-nowrap">{{ selectedIds.length }} seleccionada(s)</span>
  </div>

  <!-- Seleccionadas (resumen, siempre visibles) -->
  @if (categoriasSeleccionadas.length) {
    <div class="flex flex-wrap gap-2 pb-3 border-b border-border-soft animate-in">
      @for (cat of categoriasSeleccionadas; track cat._id) {
        <button
          type="button"
          class="chip is-active gap-1.5"
          (click)="toggle(cat._id)"
          title="Quitar"
        >
          {{ cat.nombre }}
          <svg class="w-3.5 h-3.5 opacity-80" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      }
    </div>
  }

  <!-- Lista filtrada (scrollable) -->
  <div class="flex flex-wrap gap-2 max-h-56 overflow-y-auto pr-1">
    @for (cat of categoriasFiltradas; track cat._id) {
      <button
        type="button"
        class="chip"
        [class.is-active]="isSelected(cat._id)"
        (click)="toggle(cat._id)"
      >
        {{ cat.nombre }}
      </button>
    } @empty {
      <p class="subtle text-sm py-3">No se encontraron categorías para “{{ query }}”.</p>
    }
  </div>
</div>
