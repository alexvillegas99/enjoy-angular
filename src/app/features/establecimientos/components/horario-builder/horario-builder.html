<div class="space-y-4">
  @for (b of bloques; track $index) {
    <div class="card-flat rounded-xl p-4 space-y-4 transition hover:border-border-soft">
      <!-- Días -->
      <div class="space-y-2">
        <p class="form-label mb-0">Días</p>
        <div class="flex flex-wrap gap-2">
          @for (d of DIAS; track d.k) {
            <button
              type="button"
              (click)="toggleDia(b, d.k)"
              class="chip"
              [class.is-active]="isDia(b, d.k)"
            >
              {{ d.l }}
            </button>
          }
        </div>
      </div>
      <!-- Rango de hora -->
      <div class="space-y-2">
        <p class="form-label mb-0">Horario</p>
        <div class="flex flex-wrap items-center gap-3">
          <input
            type="time"
            [(ngModel)]="b.desde"
            (ngModelChange)="emit()"
            class="input w-auto"
          />
          <span class="text-sm font-medium text-text-faint">a</span>
          <input
            type="time"
            [(ngModel)]="b.hasta"
            (ngModelChange)="emit()"
            class="input w-auto"
          />
          @if (bloques.length > 1) {
            <button
              type="button"
              (click)="removeBloque($index)"
              class="btn-ghost btn-sm ml-auto text-danger hover:bg-danger-soft!"
            >
              Quitar
            </button>
          }
        </div>
      </div>
    </div>
  }

  <button
    type="button"
    (click)="addBloque()"
    class="btn-outline btn-sm"
  >
    + Agregar otro bloque de horario
  </button>

  <!-- Vista previa -->
  <div class="surface-brand rounded-xl px-4 py-3">
    <p class="text-[11px] font-medium uppercase tracking-wide text-white/70 mb-1">Así se verá</p>
    <p class="text-sm font-semibold text-white">{{ value || '—' }}</p>
  </div>
</div>
